name: Build/Publish on push

on:
  push:
    branches:
      - "*master*"
      - "*main*"
    tags:
      - "*"
  workflow_dispatch:

jobs:
  JobBuild:
    permissions:
      contents: write
    name: build_and_test
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'WIP')"

    env:
      configuration: Release
      Main_Project: Ui/Ui.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install .NET 11 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          $installDir = if ($env:DOTNET_ROOT) { $env:DOTNET_ROOT } else { "C:\\Program Files\\dotnet" }
          ./dotnet-install.ps1 -Channel 11.0 -InstallDir $installDir
          dotnet --list-sdks

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Cache nuget packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Ui/Ui.csproj', 'Tests/Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild $env:Main_Project /t:Restore /p:Configuration=$env:Configuration
          dotnet restore Tests/Tests.csproj

      - name: Apply optional build secrets
        shell: pwsh
        env:
          SEC_APPCENTER: ${{ secrets.APP_CENTER_SECRET_1REMOTE }}
          SEC_SENTRY: ${{ secrets.SENTRY_IO_DEN }}
          SEC_SALT: ${{ secrets.GLOBAL_STRING_ENCRYPTION_SLAT }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:SEC_APPCENTER)) {
            ./scripts/Set-Secret.ps1 -filePath .\\Ui\\Assert.cs -Pattern "===REPLACE_ME_WITH_APP_CENTER_SECRET===" -Secret $env:SEC_APPCENTER
          }
          if (-not [string]::IsNullOrEmpty($env:SEC_SENTRY)) {
            ./scripts/Set-Secret.ps1 -filePath .\\Ui\\Assert.cs -Pattern "===REPLACE_ME_WITH_SENTRY_IO_DEN===" -Secret $env:SEC_SENTRY
          }
          if (-not [string]::IsNullOrEmpty($env:SEC_SALT)) {
            ./scripts/Set-Secret.ps1 -filePath .\\Ui\\Assert.cs -Pattern "===REPLACE_ME_WITH_SALT===" -Secret $env:SEC_SALT
          }

      - name: Get Version
        shell: pwsh
        run: ./scripts/Get-Version.ps1

      - name: Run Unit & Regression Tests
        shell: pwsh
        run: dotnet test Tests/Tests.csproj -c Release --verbosity normal

      - name: Publish net10-x64
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net100.pubxml

      - uses: actions/upload-artifact@v4
        with:
          name: 1Remote-${{ env.BuildVersion }}-net10-x64
          path: Ui/bin/Release/net10.0-windows/publish/win-x64

      - name: Publish net10-x64-self-contained
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net100-self-contained.pubxml

      - uses: actions/upload-artifact@v4
        with:
          name: 1Remote-${{ env.BuildVersion }}-net10-x64-self-contained
          path: Ui/bin/Release/net10.0-windows-self-contained/publish/win-x64

    outputs:
      BuildVersion: ${{ env.BuildVersion }}
      PreRelease: ${{ env.PreRelease }}
      artifact_net10x: 1Remote-${{ env.BuildVersion }}-net10-x64
      artifact_net10xsc: 1Remote-${{ env.BuildVersion }}-net10-x64-self-contained

  PublishRelease:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: JobBuild
    permissions:
      contents: write
    if: github.repository != '1Remote/1Remote'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.JobBuild.outputs.artifact_net10x }}
          path: ${{ needs.JobBuild.outputs.artifact_net10x }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.JobBuild.outputs.artifact_net10xsc }}
          path: ${{ needs.JobBuild.outputs.artifact_net10xsc }}

      - name: Package ZIPs and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.JobBuild.outputs.BuildVersion }}
          A1: ${{ needs.JobBuild.outputs.artifact_net10x }}
          A2: ${{ needs.JobBuild.outputs.artifact_net10xsc }}
        run: |
          zip -qr "${A1}.zip" "${A1}"
          zip -qr "${A2}.zip" "${A2}"
          sha256sum "${A1}.zip" "${A2}.zip" > SHA256SUMS.txt
          TAG="v${VER}"
          cat <<'EOF' > release_notes.md
          ## 1Remote __TAG__ 定制修复版

          ### 修复内容
          1. **根治 MySQL / PostgreSQL 同步假性断连报错 (`database lost connection! / Fatal error encountered during command execution.`)**
             - 将 `MysqlSource` / `PgsqlSource` 从持有单一长连接的 `DapperDatabase` 切换为连接池安全型 `DapperDatabaseFree`（每次操作独立取还连接，杜绝多线程共享同一 `MySqlStream` 撞包或中途被 `CloseConnection()` 掐断）。
             - 为 `DataSourceBase` 自检/时间戳读取与 `GlobalData` 后台定时器补齐互斥锁、防重入锁及手动刷新期间的 `StopTick()`/`StartTick()` 同步保护。
             - 将默认连接与命令超时拉长至 `10s / 20s`，启用 `utf8mb4`、`Pooling=true`、`ConnectionReset=true`、`ConnectionLifeTime=180` 与 `Keepalive=30`，并内置半开死连接自动 `ClearPool` 清池重连重试。
          2. **根治进入远程会话后点击左上角 `+` 弹出框闪退问题**
             - 在 `LauncherWindowViewModel` 与 `TabWindowView` 引入 `IsLauncherOpenOrOpening` 焦点保护窗口期，阻止 `RunForRdpV2` (100ms 轮询)、`FocusOnTabContent` 与 `AwaitTabSwitching` 抢回焦点导致 `Deactivated -> HideMe()` 秒退。
             - 移除 `Topmost = false` 焦点抖动，新增 Win32 `AttachThreadInput` 跨线程前台焦点平顺接管，并绑定当前远程标签窗 Token 确保新选设备直接在当前窗口打开。
          3. **彻底移除索取好评 / Star / 赞赏拦截弹窗**
             - 移除关闭主窗口时的 `RequestRatingView` 遮罩拦截逻辑。

          ### 软件包说明
          - `1Remote-__VER__-net10-x64-self-contained.zip`：独立自带运行时完整包（推荐，解压即用，无需安装 .NET 10 Desktop Runtime）。
          - `1Remote-__VER__-net10-x64.zip`：轻量框架依赖包（需本机已安装 .NET 10 Desktop Runtime x64）。
          EOF
          sed -i "s/__TAG__/${TAG}/g; s/__VER__/${VER}/g" release_notes.md
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${A1}.zip" "${A2}.zip" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "1Remote ${TAG} (MySQL Sync, Tab Launcher & No-Nag Fix)" --notes-file release_notes.md --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "${A1}.zip" "${A2}.zip" SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "1Remote ${TAG} (MySQL Sync, Tab Launcher & No-Nag Fix)" --notes-file release_notes.md
          fi
